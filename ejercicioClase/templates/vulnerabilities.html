<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reported Vulnerabilities</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Reported vulnerabilities</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>OWASP Category</th>
            <th>Severity</th>
        </tr>
        {% for v in vulnerabilities %}
        <tr>
            <td>{{ v.id }}</td>
            <td>{{ v.title }}</td>
            <td>{{ v.owasp_category }}</td>
            <td>{{ v.severity }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/report">Reportar nueva vulnerabilidad</a>
</body>
</html>
